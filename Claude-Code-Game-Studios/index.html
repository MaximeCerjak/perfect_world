<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ressources égales</title>
</head>
<body>
<header class="tete">
  <a class="marque" href="#/carte">Ressources égales</a>
  <div class="mondes" id="mondes" role="group" aria-label="Monde affiché"></div>
  <nav class="onglets" aria-label="Sections">
    <a href="#/carte">La vallée</a>
    <a href="#/mondes">Trois mondes</a>
    <a href="#/moi" id="mien">Retrouver mon humain</a>
  </nav>
</header>
<main>
  <section class="scene" aria-labelledby="titre-scene">
    <p class="quand" id="date" aria-live="off"></p>
    <h1 id="titre-scene"></h1>
    <div id="cadre">
      <canvas id="game" role="img" aria-label="Carte de la région"></canvas>
      <div id="etiquettes"></div>
    </div>
    <div class="temps">
      <button id="lecture" type="button" aria-label="Faire défiler les jours"></button>
      <div class="ruban">
        <canvas id="ruban" width="365" height="30" aria-hidden="true"></canvas>
        <input id="jour" type="range" min="1" max="365" value="1" aria-label="Jour affiché">
      </div>
    </div>
    <p class="legende" id="legende"></p>
  </section>
  <section class="carnet" id="contenu" aria-live="polite" tabindex="-1"></section>
</main>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
