<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ressources égales</title>
</head>
<body>
<canvas id="game" role="img" aria-label="La vallée vue du ciel"></canvas>
<div id="etiquettes"></div>
<header class="hud coin-date">
  <a class="marque" href="#/carte">Ressources égales</a>
  <p id="date" aria-live="off"></p>
</header>
<nav class="hud coin-menu" aria-label="Mondes et sections">
  <div id="mondes" role="group" aria-label="Monde affiché"></div>
  <a href="#/mondes" id="comparer">Comparer</a>
  <a href="#/chronique" id="chronique">Chronique</a>
  <a href="#/moi" id="mien">Mon humain</a>
</nav>
<div class="hud bas">
  <a id="depeche" href="#/chronique"></a>
  <div class="temps">
    <button id="lecture" type="button" aria-label="Faire défiler les jours"></button>
    <div class="ruban" title="L'année en un regard : la saison en bas, le débit de la rivière en bleu, le stock de l'entrepôt en trait clair, la part réservée de l'entrepôt en rose">
      <canvas id="ruban" width="365" height="26" aria-hidden="true"></canvas>
      <input id="jour" type="range" min="1" max="365" value="1" aria-label="Jour affiché">
    </div>
    <div class="zoom"><button id="zoom-moins" type="button" aria-label="Voir de plus loin">−</button><button id="zoom-plus" type="button" aria-label="Voir de plus près">+</button></div>
  </div>
</div>
<aside class="panneau" id="panneau" hidden>
  <a class="fermer" id="fermer" href="#/carte" aria-label="Fermer et revenir à la vallée">×</a>
  <div id="contenu" aria-live="polite" tabindex="-1"></div>
</aside>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
